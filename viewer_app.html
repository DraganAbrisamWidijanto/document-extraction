<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt Viewer — Datasaur</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; padding: 16px; color: #222; }
.container { max-width: 1400px; margin: 0 auto; }
h1 { font-size: 18px; margin-bottom: 12px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
select, button { padding: 6px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
button { cursor: pointer; }
button:active { background: #eee; }
.main { display: flex; gap: 16px; flex-wrap: wrap; }
.col { flex: 1; min-width: 320px; background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.col h2 { font-size: 14px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.imgwrap { position: relative; overflow: auto; max-height: 600px; border: 1px solid #eee; border-radius: 4px; background: #fafafa; cursor: grab; }
.imgwrap.dragging { cursor: grabbing; }
.imgwrap img { display: block; width: 100%; transform-origin: center center; transition: transform .15s ease; user-select: none; }
.imgwrap img.zoomed { transition: none; }
.zoombar { position: sticky; top: 0; left: 0; z-index: 5; display: flex; gap: 4px; padding: 6px; background: rgba(255,255,255,.92); border-bottom: 1px solid #eee; }
.zoombar button { padding: 2px 10px; font-size: 14px; }
.zoombar span { font-size: 12px; color: #666; align-self: center; min-width: 40px; text-align: center; }
pre { font-size: 11px; line-height: 1.5; overflow-x: auto; white-space: pre-wrap; word-break: break-word; max-height: 600px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #fafafa; font-weight: 600; }
.tp { color: #059669; font-weight: 600; }
.fp { color: #dc2626; }
.fn { color: #ea580c; }
.wrong { color: #dc2626; }
.nav { display: flex; gap: 4px; }
.nav a { cursor: pointer; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; color: #333; text-decoration: none; }
.nav a:hover { background: #eee; }
.nav a.active { background: #2563eb; color: #fff; border-color: #2563eb; }
.loading { color: #999; font-style: italic; }
.summary { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
<h1>🧾 Document Viewer — CORD (45) + Self-scan (5) + Kleister PDF (5)</h1>
<div class="controls">
  <select id="docSelect" onchange="loadDoc()"></select>
  <span id="nav" class="nav"></span>
  <span id="summary" class="summary"></span>
</div>
<div class="main">
  <div class="col" id="imageCol">
    <h2>Image</h2>
    <div class="imgwrap" id="imgwrap">
      <div class="zoombar">
        <button onclick="zoomBy(-0.25)" title="Zoom out">−</button>
        <span id="zoomPct">100%</span>
        <button onclick="zoomBy(0.25)" title="Zoom in">+</button>
        <button onclick="zoomReset()" title="Reset">⤾</button>
      </div>
      <img id="receiptImg" src="" alt="receipt" draggable="false">
    </div>
  </div>
  <div class="col" id="predCol">
    <h2>Prediction</h2>
    <pre id="predJson" class="loading">No prediction</pre>
  </div>
  <div class="col" id="gtCol">
    <h2>Ground Truth</h2>
    <pre id="gtJson" class="loading">No GT</pre>
    <div id="fieldTable"></div>
  </div>
</div>
</div>

<script>
let docs = [];
let currentIdx = 0;
let zoomLevel = 1;
let isDragging = false, startX = 0, startY = 0, startScrollLeft = 0, startScrollTop = 0;

// ---- zoom ----
const wrap = () => document.getElementById('imgwrap');
const imgEl = () => document.getElementById('receiptImg');

function applyZoom() {
  const im = imgEl();
  im.style.transform = zoomLevel === 1 ? '' : `scale(${zoomLevel})`;
  im.classList.toggle('zoomed', zoomLevel !== 1);
  document.getElementById('zoomPct').textContent = Math.round(zoomLevel * 100) + '%';
  // when zoomed > 1, expand image box so scrollbars work; else normal
  im.style.width = zoomLevel === 1 ? '100%' : `${100 * zoomLevel}%`;
  im.style.maxHeight = zoomLevel === 1 ? '600px' : 'none';
}
function zoomBy(d) { zoomLevel = Math.min(4, Math.max(1, zoomLevel + d)); applyZoom(); }
function zoomReset() { zoomLevel = 1; applyZoom(); wrap().scrollLeft = 0; wrap().scrollTop = 0; }

// wheel zoom (Ctrl+wheel for zoom, plain wheel scrolls)
wrap().addEventListener('wheel', e => {
  if (e.ctrlKey) {
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 0.1 : -0.1);
  }
}, { passive: false });

// drag to pan when zoomed
wrap().addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.clientX; startY = e.clientY;
  startScrollLeft = wrap().scrollLeft; startScrollTop = wrap().scrollTop;
  wrap().classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  wrap().scrollLeft = startScrollLeft - (e.clientX - startX);
  wrap().scrollTop = startScrollTop - (e.clientY - startY);
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  wrap().classList.remove('dragging');
});

async function init() {
  const r = await fetch('/api/docs');
  docs = await r.json();
  const sel = document.getElementById('docSelect');
  sel.innerHTML = docs.map((d, i) => `<option value="${i}">${d.name} (${d.split})</option>`).join('');
  loadDoc(0);
}

async function loadDoc(idx) {
  currentIdx = idx != null ? idx : parseInt(document.getElementById('docSelect').value);
  document.getElementById('docSelect').value = currentIdx;
  const d = docs[currentIdx];
  const r = await fetch(`/api/doc/${d.name}`);
  const data = await r.json();
  // nav
  document.getElementById('nav').innerHTML = `
    <a onclick="loadDoc(${currentIdx-1})" ${currentIdx<=0?'style=opacity:.3':''}>◀</a>
    <a onclick="loadDoc(${currentIdx+1})" ${currentIdx>=docs.length-1?'style=opacity:.3':''}>▶</a>
  `;
  document.getElementById('summary').textContent = `(${currentIdx+1}/${docs.length})`;
  // image (reset zoom on doc change)
  zoomReset();
  if (data.img_pages && data.img_pages.length > 1) {
    // multi-page gallery
    document.getElementById('receiptImg').style.display = 'none';
    let g = document.getElementById('pageGallery');
    if (!g) {
      g = document.createElement('div');
      g.id = 'pageGallery';
      g.style.cssText = 'display:flex;flex-direction:column;gap:8px;padding:4px;';
      document.getElementById('imgwrap').appendChild(g);
    }
    g.innerHTML = data.img_pages.map((url, i) => {
      const pi = data.page_indices ? data.page_indices[i] : i;
      return `<div data-page="${pi}" style="border:1px solid #ddd;border-radius:4px;overflow:hidden;background:#fafafa;">
        <div style="padding:2px 8px;font-size:11px;color:#666;background:#f0f0f0;border-bottom:1px solid #ddd;">Page ${pi} (${i+1}/${data.img_pages.length})</div>
        <img src="${url}" style="width:100%;display:block;" loading="lazy">
      </div>`;
    }).join('');
    g.style.display = 'flex';
  } else {
    // single image
    const g = document.getElementById('pageGallery');
    if (g) g.style.display = 'none';
    document.getElementById('receiptImg').style.display = 'block';
    document.getElementById('receiptImg').src = data.img;
  }
  // prediction
  const predEl = document.getElementById('predJson');
  if (data.prediction && Object.keys(data.prediction).length) {
    predEl.className = '';
    predEl.textContent = JSON.stringify(data.prediction, null, 2);
  } else {
    predEl.className = 'loading';
    predEl.textContent = 'No prediction';
  }
  // GT
  const gtEl = document.getElementById('gtJson');
  gtEl.className = '';
  gtEl.textContent = JSON.stringify(data.gt, null, 2);
  // field table
  const fp = data.field_pages || {};
  const hasPages = Object.keys(fp).length > 0;
  let tbl = `<table><tr><th>Field</th><th>Pred</th><th>GT</th><th>Status</th>${hasPages ? '<th>Source page(s)</th>' : ''}</tr>`;
  for (const row of data.fields) {
    const cls = row.status || '';
    const pages = hasPages && fp[row.field] ? fp[row.field].map(p => `<a onclick="scrollToPage(${p})" style="cursor:pointer;color:#2563eb;text-decoration:underline;">p${p}</a>`).join(', ') : '';
    tbl += `<tr><td>${row.field}</td><td>${row.pred ?? 'null'}</td><td>${row.gt ?? 'null'}</td><td class="${cls}">${row.status ?? '—'}</td>${hasPages ? `<td>${pages}</td>` : ''}</tr>`;
  }
  tbl += '</table>';
  // items match (receipt splits only)
  const it = data.items;
  if (it && (it.gt > 0 || it.pred > 0)) {
    tbl += `<p style="margin-top:8px;font-size:12px;color:#666;">
      Items: ${it.gt} GT → ${it.pred} pred (${it.name_tp} name match) ${it.missing.length ? ' | MISSING: '+it.missing.join(', ') : ''}
    </p>`;
  }
  // page info for PDFs
  if (data.pages_total) {
    tbl += `<p style="margin-top:8px;font-size:12px;color:#666;">
      Pages: ${data.pages_selected}/${data.pages_total} selected (${data.page_indices.join(', ')}) · ${data.latency_s}s · tokens ${data.usage ? (data.usage.prompt_tokens || 0) + '/' + (data.usage.completion_tokens || 0) : 'n/a'}
    </p>`;
  }
  document.getElementById('fieldTable').innerHTML = tbl;
}

// ---- no auto-refresh: data reloads only on manual page refresh (F5) or doc navigation ----

document.getElementById('docSelect').addEventListener('change', e => loadDoc(parseInt(e.target.value)));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && currentIdx > 0) loadDoc(currentIdx - 1);
  if (e.key === 'ArrowRight' && currentIdx < docs.length - 1) loadDoc(currentIdx + 1);
});
function scrollToPage(p) {
  const el = document.querySelector(`#pageGallery [data-page="${p}"]`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.style.outline = '2px solid #f59e0b';
    setTimeout(() => { el.style.outline = ''; }, 1500);
  }
}
init();
</script>
</body>
</html>
